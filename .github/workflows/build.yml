name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          xcodegen generate
          pod install
      - name: Build app
        run: |
          set +e
          xcodebuild -workspace ALFREDIPTV.xcworkspace -scheme ALFREDIPTV -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ALFRED_BUILD=${{ github.run_number }} build > build.log 2>&1
          code=$?
          tail -40 build.log
          if [ $code -ne 0 ]; then
            grep -E "error:" build.log | sort -u | head -40 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Make IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/ALFRED-IPTV.app" Payload/
          zip -qry ALFRED-IPTV.ipa Payload
          ls -lh ALFRED-IPTV.ipa
          cp ALFRED-IPTV.ipa com.alfredtv.ipa
          VER=$(grep MARKETING_VERSION project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          python3 -c 'import json,sys; notes=[l.strip() for l in open("RELEASE_NOTES.txt") if l.strip()]; json.dump({"version":sys.argv[1],"build":int(sys.argv[2]),"notes":notes}, open("version.json","w"))' "$VER" "${{ github.run_number }}"
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: ALFRED-IPTV-ipa
          path: ALFRED-IPTV.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ALFRED-IPTV.ipa com.alfredtv.ipa version.json --title "ALFRED-IPTV for iPhone (latest)" \
            --notes "Unsigned IPA. Sideload with Sideloadly or AltStore."
